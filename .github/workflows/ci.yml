name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: app_bdj
      POSTGRES_PORT: 5432
      JWT_SECRET: ci-jwt-secret-tests-only

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start PostgreSQL
        run: docker compose up -d db

      - name: Wait for PostgreSQL to be ready
        run: |
          for i in $(seq 1 30); do
            docker compose exec -T db pg_isready -U $POSTGRES_USER -d $POSTGRES_DB && break
            echo "Waiting for postgres… ($i/30)"
            sleep 2
          done

      - name: Run tests
        run: pnpm test
